<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ShopGame.com - Acc Valorant, Free Fire, Roblox Giá Rẻ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #08062c; color: white; font-family: 'Segoe UI', sans-serif; }
        .product-card {
            background: #0f0d38;
            border: 1px solid #1f1b5e;
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.35s ease;
        }
        .product-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 40px rgba(138, 43, 226, 0.4);
            border-color: #8a2be2 !important;
        }
        .badge-new {
            position: absolute;
            top: 10px; left: 10px;
            background: #ee2a2a;
            color: white;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 8px;
            z-index: 10;
        }
        .discount-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: #000;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 8px;
        }
        .price {
            color: #ee2a2a;
            font-weight: 800;
            font-size: 1.35rem;
        }
        .btn-view {
            background: transparent;
            border: 2px solid #ee2a2a !important;
            color: #ee2a2a;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-view:hover {
            background: #ee2a2a;
            color: white;
        }
        .category-card {
            background: #0f0d38;
            border: 1px solid #1f1b5e;
            border-radius: 14px;
            overflow: hidden;
            transition: 0.3s;
        }
        .category-card:hover {
            border-color: #ee2a2a;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header th:replace="~{layout/header :: header}"></header>

<!-- MAIN CONTENT -->
<main class="container my-5">

    <!-- Danh sách sản phẩm HOT - GIÁ CỐ ĐỊNH, SIÊU ỔN ĐỊNH -->
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-4">

        <th:block th:each="i : ${#numbers.sequence(1,12)}">
            <div class="col">
                <div class="product-card position-relative">
                    <span class="badge-new">NEW</span>
                    <span class="discount-badge"
                          th:text="'−' + (${i % 6 * 5}) + '%'">
                        -25%
                    </span>

                    <img src="https://via.placeholder.com/400x400/1a1748/ffffff?text=VALORANT+ACC"
                         class="w-100" style="height: 195px; object-fit: cover;" alt="Acc Valorant">

                    <div class="p-3">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <img src="https://i.imgur.com/9Xz1z8j.png" height="22" alt="Shoppayto">
                            <small class="text-muted fw-bold">Shoppayto</small>
                        </div>

                        <h6 class="mb-1 text-truncate">Acc Valorant Drop Mail</h6>
                        <small class="text-muted">
                            ID: ORE1870<span th:text="${i < 10 ? '0' + i : i}">01</span>
                        </small>

                        <!-- GIÁ TƯỢNG TRƯNG - KHÔNG LỖI, ĐẸP LUÔN -->
                        <div class="price mt-2"
                             th:text="${
                                i == 1 ? '1.500.000đ' :
                                i == 2 ? '2.250.000đ' :
                                i == 3 ? '720.000đ'   :
                                i == 4 ? '1.890.000đ' :
                                i == 5 ? '2.100.000đ' :
                                i == 6 ? '990.000đ'   :
                                i == 7 ? '1.350.000đ' :
                                i == 8 ? '2.499.000đ' :
                                i == 9 ? '689.000đ'   :
                                i ==10 ? '1.799.000đ' :
                                i ==11 ? '2.650.000đ' :
                                i ==12 ? '1.199.000đ' : '1.250.000đ'
                             }">
                            1.500.000đ
                        </div>

                        <a href="#" class="btn btn-view w-100 mt-3 py-2">
                            Xem Ngay
                        </a>
                    </div>
                </div>
            </div>
        </th:block>
    </div>

    <!-- Nút Xem thêm -->
    <div class="text-center my-5">
        <a href="#" class="btn btn-outline-light rounded-pill px-5 py-3 fw-bold">
            Xem thêm 200+ sản phẩm khác
        </a>
    </div>

    <hr class="border-secondary opacity-50">

    <!-- Danh mục nhanh -->
    <div class="row row-cols-2 row-cols-md-4 g-4 mt-5">
        <div class="col">
            <div class="category-card">
                <img src="https://via.placeholder.com/500x200/ee2a2a/ffffff?text=QUÉT+WECHAT+VALORANT"
                     class="w-100" style="height: 160px; object-fit: cover;" alt="Quét Wechat Valorant">
                <div class="p-3">
                    <h5 class="mb-1">Quét Wechat Valorant Mobile</h5>
                    <small class="text-muted">Đã bán: 783</small>
                    <div class="mt-3 p-2 bg-danger text-center rounded fw-bold">
                        Giá rẻ sẵn hàng
                    </div>
                </div>
            </div>
        </div>

        <div class="col">
            <div class="category-card">
                <img src="https://via.placeholder.com/500x200/8a2be2/ffffff?text=BUFF+LIKE+FB+TIKTOK"
                     class="w-100" style="height: 160px; object-fit: cover;" alt="Buff Like TikTok">
                <div class="p-3">
                    <h5 class="mb-1">Buff Like/Follow Facebook - TikTok</h5>
                    <small class="text-muted">Đã bán: 2.487</small>
                    <div class="mt-3 p-2 bg-danger text-center rounded fw-bold">
                        Giá siêu rẻ - Tăng ngay
                    </div>
                </div>
            </div>
        </div>

        <!-- Thêm danh mục khác nếu muốn -->
    </div>

</main>

<!-- FOOTER -->
<footer th:replace="~{layout/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
