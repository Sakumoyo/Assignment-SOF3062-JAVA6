<div th:fragment="header"
     class="d-flex justify-content-between align-items-center px-4 py-3 sticky-top"
     style="background-color: #08062c;">

    <!-- LEFT: Logo + Menu -->
    <div class="d-flex align-items-center gap-4">

        <!-- Logo -->
        <a href="#" class="d-flex align-items-center text-decoration-none">
            <span style="font-size: 26px; color: white; font-weight: 600;">ShopGame</span>
            <span style="color: white; font-size: 14px;">.com</span>
        </a>

        <!-- Menu -->
        <nav class="d-none d-md-flex gap-4">
            <a href="#" class="text-white text-decoration-none">Trò chơi ▾</a>
            <a href="#" class="text-white text-decoration-none">Tiện ích</a>
            <a href="#" class="text-white text-decoration-none">Buff likes</a>
        </nav>
    </div>


    <!-- RIGHT: Search + Cart + Admin -->
    <div class="d-flex align-items-center gap-4">

        <!-- Search -->
        <div class="position-relative">
            <input type="text"
                   class="form-control rounded-pill px-4"
                   placeholder="Mua đi ngại gì"
                   style="width: 230px; background:#1a1748; border:1px solid #2b2764; color:white;">
            <i class="bi bi-search"
               style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #9ca2ff;"></i>
        </div>

        <!-- Giỏ hàng -->
        <a href="#" class="text-white text-decoration-none">
            <i class="bi bi-bag" style="font-size: 20px;"></i>
        </a>

        <!-- ADMIN -->
        <div class="dropdown">
            <a href="#"
               class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
               data-bs-toggle="dropdown"
               style="padding: 6px 10px; border-radius: 50px; transition: 0.2s;">

                <!-- Avatar -->
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                     width="36" height="36"
                     class="rounded-circle shadow-sm border"
                     style="object-fit: cover; border-color: rgba(255,255,255,0.2)!important;">

                <!-- Name -->
                <span class="ms-2 fw-semibold" style="font-size: 15px;">Admin</span>
            </a>

            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark shadow-lg rounded-3"
                style="min-width: 180px; font-size: 14px;">

                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2"
                       href="#">
                        <i class="bi bi-gear"></i> Cài đặt
                    </a>
                </li>

                <li>
                    <a class="dropdown-item d-flex align-items-center gap-2 py-2"
                       href="#">
                        <i class="bi bi-person-circle"></i> Hồ sơ
                    </a>
                </li>

                <li><hr class="dropdown-divider"></li>

                <li>
                    <a class="dropdown-item text-danger d-flex align-items-center gap-2 py-2"
                       href="#">
                        <i class="bi bi-box-arrow-right"></i> Đăng xuất
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
